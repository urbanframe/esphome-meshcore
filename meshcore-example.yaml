esphome:
  name: meshcore-node

esp32:
  board: ttgo-t-beam
  framework:
    type: esp-idf
    
external_components:
  - source: github://urbanframe/esphome-meshcore@main
    components: [meshcore]
    refresh: 1d
    
logger:

web_server:
  
# Enable Home Assistant API
api:
  
ota:
  - platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  # Set up a wifi access point
  ssid: !secret iot_wifi_ssid
  password: !secret iot_wifi_password
  ap: {}
      


spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

sx127x:
  id: lora_radio
  cs_pin: GPIO18
  rst_pin: GPIO23
  dio0_pin: GPIO26
  modulation: LORA
  pa_pin: BOOST     # T-Beam's SX1276 is wired to the PA_BOOST pin, not RFO
  pa_power: 17      # BOOST mode max is 17; ESPHome will reject >17 here
  frequency: 869618000
  bandwidth: 62_5kHz
  spreading_factor: 8
  coding_rate: CR_4_5
  preamble_size: 32
  sync_value: [0x12]  # RadioLib's RADIOLIB_SX126X_SYNC_WORD_PRIVATE — confirmed against MeshCore's own source (platformio.ini + RadioLibWrappers.h)

meshcore:
  id: mesh_node
  lora: lora_radio
  # Generate a real keypair once (see README / tools/generate_identity.py)
  # and pin it here so your node keeps the same identity across
  # reboots/reflashes — otherwise you get a new, unrecognisable address
  # every boot and the peer_public_key handshake below can't work.
  public_key: !secret meshcore_public_key
  private_key: !secret meshcore_private_key
  node_name: "ESPHome MeshCore Node"

  # The one person you want to talk to. Get this from their MeshCore app
  # (their own node's public key, NOT a channel PSK). With this set, direct
  # messages from anyone else are ignored, and send_message always targets
  # them — no contact table or discovery needed.
  peer_public_key: !secret meshcore_peer_public_key

  on_message:
    then:
      - logger.log:
          format: "MeshCore message: %s"
          args: ["text.c_str()"]
      - text_sensor.template.publish:
          id: meshcore_last_message
          state: !lambda 'return text;'

text_sensor:
  - platform: template
    name: "MeshCore Last Message"
    id: meshcore_last_message

text:
  - platform: template
    name: "MeshCore Message to Send"
    id: meshcore_message_to_send
    optimistic: true
    mode: text
    initial_value: ""

button:
  - platform: template
    name: "Send MeshCore Message"
    on_press:
      - meshcore.send_message:
          id: mesh_node
          text: !lambda 'return id(meshcore_message_to_send).state;'
